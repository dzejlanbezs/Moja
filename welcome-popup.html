<!-- ============================================================
     Virtusjack — welcome bonus popup

     Zalepi ovaj blok u index.html, neposredno pre </body>.
     U <head> ide:   <link rel="stylesheet" href="assets/css/welcome-popup.css">
     Pre </body>:    <script src="assets/js/welcome-popup.js"></script>

     Podesavanja se menjaju preko data- atributa na #vjWelcomePopup:
       data-delay="700"       koliko ms posle ucitavanja da se pojavi
       data-repeat="24"       posle koliko sati sme ponovo (0 = svaki put, "never" = samo jednom)
       data-claim-url="#register"   gde vodi zlatno dugme ("" = nikuda)
       data-wait-for=".loader"     ceka da ekran za ucitavanje nestane
       data-auto="false"      iskljucuje automatsko otvaranje
     ============================================================ -->
<div class="vj-pop" id="vjWelcomePopup" hidden
     data-delay="700" data-repeat="24" data-claim-url="#register" data-wait-for=".loader">
  <div class="vj-pop-card" role="dialog" aria-modal="true" aria-labelledby="vjPopTitle" tabindex="-1">

    <button class="vj-pop-close" type="button" data-vj-pop-close aria-label="Close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>

    <!-- logo: zameni <svg> sa <img src="assets/img/logo/mark.png" alt="Virtusjack"> ako hoces svoju sliku -->
    <div class="vj-pop-logo">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="9.2"/>
        <path d="M12 7.4l3.3 2.4-1.3 3.9h-4L8.7 9.8 12 7.4Z" class="fill"/>
        <path d="M12 2.9v4.5M4.4 10.1l4.3-.3M19.6 10.1l-4.3-.3M7.7 20.1l2.3-6.4M16.3 20.1L14 13.7"/>
      </svg>
    </div>

    <span class="vj-pop-kicker">Welcome Offer</span>
    <h2 class="vj-pop-title" id="vjPopTitle">100% Sports Bonus</h2>
    <p class="vj-pop-sub">Receive 100% of your first deposit as a Free Bet!</p>

    <span class="vj-pop-badge">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 3l7.5 3v6.2c0 4.3-3.2 7.5-7.5 9.3-4.3-1.8-7.5-5-7.5-9.3V6L12 3Z"/>
        <path d="M8.8 12.2l2.3 2.3 4.1-4.4"/>
      </svg>
      No Wager Requirement
    </span>

    <div class="vj-pop-amount">
      <span>Up to</span>
      <b>$1,000</b>
    </div>

    <div class="vj-pop-terms">
      <div class="vj-pop-row">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8.5A2.5 2.5 0 0 0 4 15.5V19h16v-3.5a2.5 2.5 0 0 1 0-7V5H4v3.5Z"/><path d="M12 8.5v7"/></svg>
        <p>Bet type</p>
        <b>Single only</b>
      </div>
      <div class="vj-pop-row">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17.5l5-5 3.2 3.2L20 8"/><path d="M15.4 8H20v4.6"/></svg>
        <p>Allowed odds</p>
        <b>1.50x &ndash; 5.00x</b>
      </div>
    </div>

    <button class="vj-pop-cta" type="button" data-vj-pop-claim>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 8H4v12h16V8Z"/><path d="M12 8v12M3 8l2.4-3.2A2.6 2.6 0 0 1 12 6.2a2.6 2.6 0 0 1 6.6-1.4L21 8"/></svg>
      Claim Bonus
    </button>
    <button class="vj-pop-later" type="button" data-vj-pop-close>Maybe later</button>

    <p class="vj-pop-fine">New players only. Free bet must be played as a Single at odds from
      1.50x to 5.00x. 18+ &middot; Terms apply.</p>
  </div>
</div>
